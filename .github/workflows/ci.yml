name: Loom

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

jobs:
  host:
    name: Library / Linux x86-64 / Release / Host
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$PWD"
      - uses: ./.github/actions/setup-sdk
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/loom-bazel-cache
          key: loom-library-v1-linux-host-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: loom-library-v1-linux-host-
      - name: Check release candidate tree
        if: >-
          (github.event_name == 'pull_request' &&
           github.event.pull_request.base.ref == github.event.repository.default_branch) ||
          (github.event_name == 'push' &&
           github.ref_name == github.event.repository.default_branch)
        run: python -B build_tools/ci/check_release_tree.py
      - name: Check installed SDK build boundary
        run: |
          bazel aquery --config=amdgpu --noinclude_commandline --noinclude_artifacts \
            'mnemonic("CppCompile|CppLink", deps(//...))' > "$RUNNER_TEMP/native-actions.txt"
          if [[ -s "$RUNNER_TEMP/native-actions.txt" ]]; then
            cat "$RUNNER_TEMP/native-actions.txt"
            echo "Installed SDK consumers must not rebuild native HRX tools" >&2
            exit 1
          fi
      - name: Check library
        id: checks
        run: |
          echo "directory=$RUNNER_TEMP" >> "$GITHUB_OUTPUT"
          bazel query 'tests(//...)' --output=xml > "$RUNNER_TEMP/tests.xml"
          python -B build_tools/ci/test_resources.py "$RUNNER_TEMP/tests.xml" \
            > "$RUNNER_TEMP/test-tag-filters.txt"
          python dev.py test -- \
            --build_tests_only "$(cat "$RUNNER_TEMP/test-tag-filters.txt")" \
            --profile="$RUNNER_TEMP/library-host.profile.gz"
      - name: Save action and test results
        if: always() && !cancelled()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/loom-bazel-cache
          key: loom-library-v1-linux-host-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload build profile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: library-linux-host-attempt-${{ github.run_attempt }}
          # Multiline uploads need paths resolved inside the job container.
          path: |
            ${{ steps.checks.outputs.directory }}/library-host.profile.gz
            ${{ steps.checks.outputs.directory }}/test-tag-filters.txt
          if-no-files-found: ignore
          compression-level: 0

  hardware:
    name: Library / Linux x86-64 / Release / ${{ matrix.name }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AMD gfx942
            id: gfx942
            runner: linux-gfx942-1gpu-ccs-csp-ossci-rocm
          - name: AMD gfx110x
            id: gfx110x
            runner: linux-gfx110X-gpu-rocm
          - name: AMD gfx1150 GPU + NPU4
            id: gfx1150-npu4
            runner: linux-gfx1150-gpu-rocm-npu
            npu: true
          - name: AMD gfx1151
            id: gfx1151
            runner: linux-gfx1151-gpu-rocm
          - name: AMD gfx120x
            id: gfx120x
            runner: linux-gfx120X-gpu-rocm
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
      options: >-
        --ipc host --device /dev/kfd --device /dev/dri
        --group-add video --group-add 993 --group-add 992 --group-add 110
        --ulimit memlock=-1:-1 --security-opt seccomp=unconfined --user 0:0
        ${{ !matrix.npu && '--env-file /etc/podinfo/gha-gpu-isolation-settings' || '' }}
        ${{ matrix.npu && '--device /dev/accel/accel0' || '' }}
    env:
      HARDWARE_RESOURCES: ${{ matrix.npu && 'libamdf.resource.amd_gpu libamdf.resource.xdna' || 'libamdf.resource.amd_gpu' }}
      HARDWARE_ID: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$PWD"
      - uses: ./.github/actions/setup-sdk
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/loom-bazel-cache
          key: loom-library-v1-linux-${{ matrix.id }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: loom-library-v1-linux-${{ matrix.id }}-
      - name: Identify hardware environment
        id: hardware_environment
        run: |
          echo "directory=$RUNNER_TEMP" >> "$GITHUB_OUTPUT"
          "$RUNNER_TEMP/loom-sdk-venv/bin/loom-serve" --list_devices=amdgpu > "$RUNNER_TEMP/gpu.txt"
          test -s "$RUNNER_TEMP/gpu.txt"
          if [[ "$HARDWARE_RESOURCES" == *xdna* ]]; then
            "$RUNNER_TEMP/loom-sdk-venv/bin/loom-serve" --list_devices=xdna > "$RUNNER_TEMP/npu.txt"
            test -s "$RUNNER_TEMP/npu.txt"
          fi
          {
            echo "$HARDWARE_ID"
            uname -srv
            cat "$RUNNER_TEMP/gpu.txt"
            if [[ -f "$RUNNER_TEMP/npu.txt" ]]; then cat "$RUNNER_TEMP/npu.txt"; fi
            for module in amdgpu amdxdna; do
              for field in version srcversion; do
                path="/sys/module/$module/$field"
                if [[ -f "$path" ]]; then
                  printf '%s=' "$path"
                  cat "$path"
                fi
              done
            done
            for device in /sys/class/drm/card*/device /sys/class/accel/accel*/device; do
              for path in "$device"/{vendor,device,revision,fw_version} "$device"/fw_version/*; do
                if [[ -f "$path" ]]; then
                  printf '%s=' "$path"
                  cat "$path"
                fi
              done
            done
          } > "$RUNNER_TEMP/hardware.txt"
          cat "$RUNNER_TEMP/hardware.txt"
          echo "LOOM_TEST_PLATFORM=$(sha256sum "$RUNNER_TEMP/hardware.txt" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Check hardware execution profiles
        run: |
          bazel query 'tests(//...)' --output=xml > "$RUNNER_TEMP/tests.xml"
          read -r -a resources <<< "$HARDWARE_RESOURCES"
          python -B build_tools/ci/test_resources.py "$RUNNER_TEMP/tests.xml" \
            --available "${resources[@]}" > "$RUNNER_TEMP/test-tag-filters.txt"
          bazel test --config=amdgpu --build_tests_only \
            "$(cat "$RUNNER_TEMP/test-tag-filters.txt")" \
            --test_env="LOOM_TEST_PLATFORM=$LOOM_TEST_PLATFORM" \
            --profile="$RUNNER_TEMP/library-hardware.profile.gz" //...
      - name: Save action and test results
        if: always() && !cancelled()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/loom-bazel-cache
          key: loom-library-v1-linux-${{ matrix.id }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload hardware evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: library-linux-${{ matrix.id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ steps.hardware_environment.outputs.directory }}/hardware.txt
            ${{ steps.hardware_environment.outputs.directory }}/gpu.txt
            ${{ steps.hardware_environment.outputs.directory }}/npu.txt
            ${{ steps.hardware_environment.outputs.directory }}/test-tag-filters.txt
            ${{ steps.hardware_environment.outputs.directory }}/library-hardware.profile.gz
          if-no-files-found: ignore
          compression-level: 0
