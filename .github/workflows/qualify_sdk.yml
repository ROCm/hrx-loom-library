name: Loom SDK / Qualification

on:
  workflow_dispatch:
    inputs:
      run:
        description: Successful ROCm/hrx-system Loom / SDK workflow run ID or URL
        required: true
        type: string

concurrency:
  group: loom-sdk-qualification
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Prepare draft qualification PR
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require the default branch workflow
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SELECTED_REF: ${{ github.ref_name }}
        run: |
          if [[ "$SELECTED_REF" != "$DEFAULT_BRANCH" ]]; then
            echo "Dispatch this workflow from $DEFAULT_BRANCH, not $SELECTED_REF." >&2
            exit 1
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Select the qualified SDK artifact
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_RUN: ${{ inputs.run }}
        run: python -B build_tools/ci/update_sdk.py "$SDK_RUN"
      - name: Open the qualification pull request
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.candidate.outputs.run_id }}
          VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          branch="automation/loom-sdk-run-$RUN_ID"
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --head "$branch" --json url --jq '.[0].url // ""')
          if [[ -n "$existing" ]]; then
            echo "Qualification PR already exists: $existing"
            gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null; then
            echo "Branch $branch exists without an open qualification PR." >&2
            exit 1
          else
            remote_status=$?
            if [[ $remote_status -ne 2 ]]; then
              exit "$remote_status"
            fi
          fi
          if git diff --quiet -- MODULE.bazel build_tools/ci/sdk.json; then
            echo "The selected SDK is already the library default."
            exit 0
          else
            diff_status=$?
            if [[ $diff_status -ne 1 ]]; then
              exit "$diff_status"
            fi
          fi

          git switch -c "$branch"
          git add MODULE.bazel build_tools/ci/sdk.json
          message="$RUNNER_TEMP/qualification-commit.txt"
          cat > "$message" <<EOF
          [CI] Qualify Loom SDK $VERSION

          Select one qualified Release wheel and its matching HRX source
          revision for the library host and hardware gates.
          EOF
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -F "$message"
          gh auth setup-git
          git push origin "$branch"

          body="$RUNNER_TEMP/qualification-pr.md"
          cat > "$body" <<EOF
          Qualifies hrx-loom $VERSION from a successful Loom / SDK workflow across the library's host and hardware lanes. The SDK artifact, digest, and matching public Bazel source revision are pinned together; merging this PR makes the candidate the library default.

          ## Reviewer Notes

          Review the selected HRX source and SDK artifact in the two-file pin change, then use the dispatched qualification run for host and hardware evidence.
          EOF
          pull_request=$(gh pr create --repo "$GITHUB_REPOSITORY" --draft \
            --base "$DEFAULT_BRANCH" --head "$branch" \
            --title "[CI] Qualify Loom SDK $VERSION" --body-file "$body")
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          {
            echo "### SDK qualification"
            echo
            echo "Draft PR: $pull_request"
            echo
            echo "Dispatched the normal library qualification workflow on \`$branch\`."
          } >> "$GITHUB_STEP_SUMMARY"
