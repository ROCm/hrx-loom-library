name: Loom Library / Release

on:
  workflow_dispatch:

concurrency:
  group: loom-library-release
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish SDK-qualified library
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require the reviewed default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SELECTED_REF: ${{ github.ref_name }}
        run: |
          if [[ "$SELECTED_REF" != "$DEFAULT_BRANCH" ]]; then
            echo "Dispatch this workflow from $DEFAULT_BRANCH, not $SELECTED_REF." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Require an admitted release tree
        run: python -B build_tools/ci/check_release_tree.py
      - uses: ./.github/actions/setup-sdk
      - name: Prove the coordinated catalog and publish the immutable library
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -B build_tools/ci/release_library.py
          --loom-fetch="$RUNNER_TEMP/loom-sdk-venv/bin/loom-fetch"
