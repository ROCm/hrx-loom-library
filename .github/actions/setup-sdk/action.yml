name: Install the pinned Loom SDK
description: Select a qualified Release wheel and the matching public Bazel rules.

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.12"

    - name: Download the pinned SDK
      id: sdk
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python -B build_tools/ci/setup_sdk.py \
          --output="$RUNNER_TEMP/loom-sdk-wheel"
        # runner.temp is a host path; Bazel runs inside the job container.
        echo "cache=$RUNNER_TEMP/loom-bazel-cache" >> "$GITHUB_OUTPUT"

    - name: Install SDK
      shell: bash
      env:
        WHEEL: ${{ steps.sdk.outputs.wheel }}
      run: |
        python -m venv "$RUNNER_TEMP/loom-sdk-venv"
        "$RUNNER_TEMP/loom-sdk-venv/bin/python" -m pip install \
          --no-deps --no-index --no-compile "$RUNNER_TEMP/loom-sdk-wheel/$WHEEL"

    - name: Set up Bazel
      uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
      with:
        bazelisk-cache: true
        bazelisk-version: "1.29.0"
        repository-cache: true
        cache-save: ${{ github.event_name == 'push' }}
        bazelrc: |
          build --disk_cache=${{ steps.sdk.outputs.cache }}
          # Materialize runfiles when an action executes, after cache lookup.
          build --nobuild_runfile_links
          # Keep failures and totals visible without listing cached successes.
          test --test_summary=terse

    - name: Select installed toolchain
      shell: bash
      run: python dev.py setup --sdk="$RUNNER_TEMP/loom-sdk-venv/bin/python"
